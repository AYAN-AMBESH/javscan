[package]
name = "javscan"
version = "0.1.0"
edition = "2021"
description = "Advanced Java Static Application Security Testing (SAST) tool with AST-based taint analysis"
license = "MIT"
repository = "https://github.com/AYAN-AMBESH/javscan"
keywords = ["security", "sast", "java", "static-analysis", "taint-analysis"]
categories = ["command-line-utilities", "development-tools"]

[lib]
name = "javscan"
path = "src/lib.rs"

[[bin]]
name = "javscan"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"
walkdir = "2"
regex = "1"
colored = "3"
tree-sitter = "0.25"
tree-sitter-java = "0.23"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
globset = "0.4"

[profile.release]
lto = true
codegen-units = 1
